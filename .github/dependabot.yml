version: 2
updates:
  # npm packages (Astro and friends). Minor/patch bumps arrive as one grouped
  # PR per month; major versions get their own PR so breaking changes stand out.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Versions of the actions used in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
