# Papers and reports, newest first. Shown on /papers (grouped by year)
# and on the home page (entries with `selected: true`). Talks live in talks.yaml.
#
# Fields:
#   title    (required)
#   authors  (required) list; your own name is bolded automatically
#            ("William Zijie Zhang" or "William Zhang", see src/lib/papers.ts)
#   venue    (required) journal / conference / "arXiv preprint" / ...
#   year     (required)
#   note     optional one-liner, e.g. "Oral presentation"
#   selected optional, true = also list on the home page
#   links    optional map of label -> URL, rendered as [label] chips
#            (pdf, arxiv, code, slides, poster, video, ...)
#   bibtex   optional BibTeX entry, shown behind a [bibtex] toggle.
#            For arXiv papers, copy it from "Export BibTeX Citation" on the abs page.
#
# Example:
# - title: "A primal-dual interior-point method for time-varying constraints"
#   authors: [William Zijie Zhang, Antoine Lesage-Landry]
#   venue: arXiv preprint
#   year: 2026
#   selected: true
#   links:
#     arxiv: https://arxiv.org/abs/xxxx.xxxxx
#     code: https://github.com/...

