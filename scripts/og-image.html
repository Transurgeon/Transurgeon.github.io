<!doctype html>
<!--
  Template for public/og.png, the link-preview image (1200x630).
  Regenerate after editing, from the repo root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --window-size=1200,630 --screenshot=public/og.png \
      "file://$PWD/scripts/og-image.html"
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Source Serif 4'; font-weight: 400;
    src: url('../node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-400-normal.woff2'); }
  @font-face { font-family: 'Source Serif 4'; font-weight: 600;
    src: url('../node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-600-normal.woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fffefc; color: #1a1a1a;
    font-family: 'Source Serif 4', Georgia, serif;
    display: flex; align-items: center; gap: 56px;
    padding: 0 88px; box-sizing: border-box;
    border-top: 14px solid #1f4e99;
  }
  img { width: 300px; height: 420px; object-fit: cover; object-position: 30% 55%; border-radius: 8px; flex: none; }
  h1 { font-size: 64px; white-space: nowrap; font-weight: 600; line-height: 1.08; margin: 0 0 28px; }
  p { font-size: 32px; line-height: 1.4; color: #555; margin: 0 0 40px; }
  .url { font-size: 28px; color: #1f4e99; }
</style>
</head>
<body>
  <div>
    <h1>William Zijie Zhang</h1>
    <p>Maintainer of CVXPY and SparseDiffEngine.<br>Optimization modeling languages, computational linear algebra and programming.</p>
    <div class="url">zijie.ca</div>
  </div>
  <img src="../src/assets/portrait.jpg" alt="">
</body>
</html>
